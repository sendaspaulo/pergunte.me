<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curva | Frota</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f4;color:#142d30;font:16px/1.45 Inter,Arial,sans-serif}header{height:76px;background:#103738;color:white;padding:0 max(5vw,24px);display:flex;align-items:center;gap:22px}header span{padding-left:22px;border-left:1px solid #67908d;color:#dfebe8}header small{margin-left:auto;color:#dfebe8}.brand{font-size:32px;letter-spacing:-2px;display:flex;align-items:center;gap:10px}.brand i{font-size:40px;line-height:1;color:#d6f377;transform:rotate(-16deg)}main{max-width:1230px;margin:auto;padding:50px 5vw}.intro,.tools,.filters,.top,.actions,footer{display:flex;align-items:center;justify-content:space-between;gap:15px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:#47706d;margin:0}h1{font-size:clamp(34px,4vw,52px);line-height:1.08;letter-spacing:-2px;margin:8px 0 0}h2{font-size:23px;letter-spacing:-.7px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #bdd0cb;border-radius:8px;background:white;color:#214845;padding:9px 14px;font-weight:600}button:hover{filter:brightness(.94)}.primary{background:#d8ef89;border-color:#c6db78;color:#1c3426}.intro button{padding:13px 18px}#summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0 24px}.metric{background:#fff;border:1px solid #d8e1df;border-radius:12px;padding:18px 20px;position:relative}.metric:first-child{background:#184743;color:white}.metric label{font-size:14px}.metric b{font-size:36px;display:block;line-height:1.3}.panel{border:1px solid #d8e1df;border-radius:15px;overflow:hidden;background:white}.tools{padding:20px 24px}.filters{gap:10px}label{display:block;font-size:14px;font-weight:600}input,select{display:block;width:100%;padding:9px 12px;margin-top:5px;border:1px solid #b8cac6;border-radius:7px;background:white;color:#183d3a}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th,td{padding:15px 10px;border-top:1px solid #e1e8e6}th:first-child,td:first-child{padding-left:24px}th{font-size:13px;color:#506762;background:#f7faf8}td small{display:block;color:#5b6d68}td button{font-size:14px;padding:5px 8px;margin:2px}.badge{border-radius:18px;padding:5px 10px;font-size:14px;background:#dcf1df;color:#215e37}.s1{background:#e1ebfa;color:#2e5387}.s2{background:#faedcf;color:#75531c}footer,#empty{padding:14px 24px;color:#526864;font-size:14px}footer{border-top:1px solid #dde6e2}dialog{width:min(480px,94vw);border:0;border-radius:14px;padding:25px;color:#173b36}dialog::backdrop{background:#0c2929aa}dialog h2{margin:0 0 12px}.top button{font-size:20px;border:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}form label{margin-top:12px}.actions{justify-content:flex-end;margin-top:20px}.danger{background:#963a3e;color:white}.err{color:#92383a}#notice{color:#225346}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #498db2;outline-offset:2px}@media(max-width:760px){main{padding:28px 16px}.intro,.tools{align-items:flex-start;flex-direction:column}.tools{padding:16px}#summary{grid-template-columns:1fr 1fr}.filters{flex-wrap:wrap}.metric{padding:12px}header small{display:none}header{height:60px;gap:10px}header span{font-size:14px}.pair{grid-template-columns:1fr}footer{flex-wrap:wrap}}

</style>
<header><strong class="brand"><i aria-hidden="true">≋</i> curva</strong><span>Locadora de veículos</span><small>Painel operacional</small></header>
<main><section class="intro"><div><p class="eyebrow">GESTÃO DA LOCADORA</p><h1>Frota de veículos</h1></div><button class="primary" id="add">+ Cadastrar veículo</button></section>
<section id="summary" aria-label="Resumo da frota"></section>
<section class="panel"><div class="tools"><h2>Inventário</h2><div class="filters"><label>Pesquisar<input id="search" type="search" placeholder="Modelo ou placa"></label><label>Situação<select id="filter"><option value="">Todas as situações</option></select></label></div></div>
<div class="scroll"><table><thead><tr><th>Veículo</th><th>Placa</th><th>Diária</th><th>Situação</th><th>Ações</th></tr></thead><tbody></tbody></table></div><p id="empty" hidden>Nenhum veículo encontrado.</p><footer><span id="count"></span><span>Dados salvos neste navegador</span></footer></section><p id="notice" role="status"></p></main>
<dialog id="edit"><form id="entry"><div class="top"><h2 id="formTitle">Cadastrar veículo</h2><button type="button" aria-label="Fechar" class="close">×</button></div><label>Marca e modelo<input name="model" required maxlength="70" placeholder="Ex. Fiat Argo"></label><div class="pair"><label>Placa<input name="plate" required maxlength="9" placeholder="ABC1D23"></label><label>Categoria<select name="category"></select></label></div><div class="pair"><label>Diária em reais<input name="rate" type="number" required step=".01" min=".01" max="999999"></label><label>Situação<select name="status"></select></label></div><p class="err" role="alert"></p><div class="actions"><button type="button" class="close">Cancelar</button><button class="primary">Salvar veículo</button></div></form></dialog>
<dialog id="del"><form id="remove"><h2>Excluir veículo?</h2><p id="deltext"></p><p class="err" role="alert"></p><div class="actions"><button type="button" class="close" autofocus>Cancelar</button><button class="danger">Excluir veículo</button></div></form></dialog><script>
'use strict';
const key='curva-frota-v1';
const states=['Disponível','Locado','Manutenção'];
const categories=['Econômico','Sedã','SUV','Utilitário'];
const sample=[
 ['Fiat Argo','CRV1A01','Econômico',129,0],['Chevrolet Onix','CRV1A02','Econômico',139,1],['Toyota Corolla','CRV1A03','Sedã',249,0],['Jeep Renegade','CRV1A04','SUV',229,2],['Renault Duster','CRV1A05','SUV',209,0],['Fiat Fiorino','CRV1A06','Utilitário',179,1]
].map(([model,plate,category,rate,status],i)=>({id:String(i+1),model,plate,category,rate,status:states[status]}));
function read(){const raw=localStorage.getItem(key);return raw===null?sample:JSON.parse(raw)}
function normalize(x){return x.trim().toUpperCase().replace(/[-\s]/g,'')}
function validated(data,list,id){const model=data.model.trim(),plate=normalize(data.plate),rate=Number(data.rate);
 if(!model||!/^([A-Z]{3}\d[A-Z0-9]\d{2})$/.test(plate))throw Error('Informe o modelo e uma placa no formato ABC1234 ou ABC1D23.');
 if(list.some(v=>v.plate===plate&&v.id!==id))throw Error('Esta placa já está cadastrada.');
 if(!Number.isFinite(rate)||rate<=0||rate>999999||Math.abs(rate*100-Math.round(rate*100))>0.00001)throw Error('Informe uma diária positiva com até duas casas decimais.');
 if(!states.includes(data.status)||!categories.includes(data.category))throw Error('Selecione uma categoria e uma situação.');
 return {id:id||crypto.randomUUID(),model,plate,rate,category:data.category,status:data.status}}
function visible(list,q,s){const term=q.trim().toLowerCase();return list.filter(v=>(!s||v.status===s)&&(v.model.toLowerCase().includes(term)||v.plate.toLowerCase().includes(normalize(term).toLowerCase())))}
const $=s=>document.querySelector(s), tbody=$('tbody'),entry=$('#entry'),edit=$('#edit'),del=$('#del');
let selected=null;const fmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function el(tag,txt){const e=document.createElement(tag);e.textContent=txt;return e}
function options(select,items){items.forEach(t=>select.add(new Option(t,t)))}
options($('#filter'),states);options(entry.elements.status,states);options(entry.elements.category,categories);
function draw(){const list=read(),rows=visible(list,$('#search').value,$('#filter').value);tbody.replaceChildren();$('#summary').replaceChildren();
 ['Total na frota','Disponíveis','Locados','Em manutenção'].forEach((s,i)=>{const box=el('div','');box.className='metric';box.append(el('label',s),el('b',i?list.filter(v=>v.status===states[i-1]).length:list.length));$('#summary').append(box)});
 for(const v of rows){const tr=el('tr',''),model=el('td','');model.append(el('strong',v.model),el('small',v.category));const state=el('td',''),badge=el('span',v.status);badge.className='badge s'+states.indexOf(v.status);state.append(badge);const actions=el('td','');
 for(const [label,fn] of [['Editar',()=>openEdit(v)],['Excluir',()=>openDelete(v)]]){const btn=el('button',label);btn.setAttribute('aria-label',label+' '+v.model);btn.onclick=fn;actions.append(btn)}tr.append(model,el('td',v.plate),el('td',fmt.format(v.rate)),state,actions);tbody.append(tr)}
 $('#count').textContent=rows.length+' de '+list.length+' veículos';$('#empty').hidden=rows.length>0}
function openEdit(v){entry.reset();entry.querySelector('.err').textContent='';selected=v?.id||null;$('#formTitle').textContent=v?'Editar veículo':'Cadastrar veículo';if(v)for(const k of ['model','plate','rate','status','category'])entry.elements[k].value=v[k];edit.showModal()}
function openDelete(v){selected=v.id;$('#deltext').textContent='Remover '+v.model+' ('+v.plate+') da frota?';del.querySelector('.err').textContent='';del.showModal()}
function persist(list,d,msg){localStorage.setItem(key,JSON.stringify(list));d.close();draw();$('#notice').textContent=msg}
entry.onsubmit=e=>{e.preventDefault();try{const list=read();if(selected&&!list.some(v=>v.id===selected))throw Error('Veículo já excluído. Feche e atualize a lista.');const car=validated(Object.fromEntries(new FormData(entry)),list,selected);persist(selected?list.map(v=>v.id===selected?car:v):[...list,car],edit,'Veículo salvo.')}catch(err){entry.querySelector('.err').textContent=err.message}};
$('#remove').onsubmit=e=>{e.preventDefault();try{persist(read().filter(v=>v.id!==selected),del,'Veículo excluído.')}catch(err){del.querySelector('.err').textContent=err.message}};
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('#add').onclick=()=>openEdit();$('#search').oninput=draw;$('#filter').onchange=draw;window.addEventListener('storage',draw);draw();

</script></html>
